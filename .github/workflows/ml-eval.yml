name: Prediction Evaluation

# Repite la evaluación de T24 (Docs/s10/evaluacion-prediccion.md) con los métodos simples.
# Prophet ya no está en requirements.txt; para incluirlo hay que instalarlo aparte.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/app/services/cycle_forecast.py'
      - 'backend/app/services/prediction_service.py'
      - 'backend/scripts/evaluate_prediction.py'
      - '.github/workflows/ml-eval.yml'

env:
  PYTHON_VERSION: '3.12'

jobs:
  evaluate:
    name: Evaluate prediction methods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Run evaluation (synthetic, sin Prophet)
        run: |
          python backend/scripts/evaluate_prediction.py --skip-prophet --users 200 | tee eval_report.md

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: prediction-evaluation-report
          path: eval_report.md
