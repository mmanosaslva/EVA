name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'api/**'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'api/**'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/backend.yml'

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install "$(grep -E '^ruff==' backend/requirements-dev.txt)"

      - name: Run Ruff
        run: ruff check backend/ api/

  test:
    name: Test (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          # Igual que Vercel: desde el requirements.txt de la raíz, que incluye el del backend.
          pip install -r requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: pytest backend/tests/ -v
        env:
          ENVIRONMENT: ci
